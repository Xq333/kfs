set timeout=0 # Sets the boot menu timeout to 0 seconds, GRUB boots immediately without showing a menu
set default=0 # Sets the default menu entry to the first one (index 0)

menuentry "sobOS" { # The name appears in the boot menu (if timeout > 0), defines a menu entry named "sobOS"
    multiboot /boot/kernel # Tells GRUB to load your kernel using the Multiboot* protocol, /boot/kernel is the path to your kernel binary on the ISO/filesystem
    boot # Actually boots/starts the kernel that was loaded, without this, GRUB would load the kernel but not execute it
}

# Multiboot is a standardized boot protocol that allows bootloaders to load kernels with memory maps and boot info
# Other boot protocols include: Multiboot 2 (more flexible), EFI/UEFI (modern hardware), Linux Boot (Linux-specific), and BIOS Boot (legacy)


